<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Halloween 👻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --night:#150d2b; --plum:#2a1850; --moon:#fff1c9; --pumpkin:#ff8a3d; --cream:#fff6df;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cream);
  font-family:'Chewy','ZCOOL KuaiLe','Comic Sans MS','PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,#4a2478 0%,var(--plum) 40%,var(--night) 80%);overflow:hidden}
#app.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-12px,6px)}35%{transform:translate(10px,-8px)}55%{transform:translate(-8px,-4px)}75%{transform:translate(6px,6px)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--moon);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.moon{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7%);right:10%;width:clamp(60px,14vmin,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,var(--moon) 60%,#e9d392);box-shadow:0 0 60px 12px rgba(255,241,201,.35)}
.fog{position:absolute;left:-10%;right:-10%;bottom:-6%;height:30%;background:radial-gradient(ellipse at 50% 100%,rgba(255,246,223,.22),transparent 70%);pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
[hidden]{display:none!important}
h1{margin:0;font-weight:400;font-size:clamp(40px,11vw,92px);line-height:1.05;color:var(--pumpkin);
  text-shadow:0 0 18px rgba(255,138,61,.6),0 4px 0 #8a3a10;animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.55}50%{opacity:1}53%{opacity:.7}55%{opacity:1}}
.sub{margin:0;font-size:clamp(16px,4.2vw,22px);letter-spacing:.06em;opacity:.9}
.btn{font:inherit;font-size:clamp(18px,4.6vw,24px);padding:.7em 1.5em;border-radius:999px;border:3px solid var(--cream);cursor:pointer;
  background:transparent;color:var(--cream);touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
.btn.main{background:var(--pumpkin);border-color:var(--pumpkin);color:#2b1204;box-shadow:0 6px 0 #a24a14,0 0 26px rgba(255,138,61,.5)}
.btn.main:active{transform:translateY(4px);box-shadow:0 2px 0 #a24a14}
.btn.run{transition:left .22s cubic-bezier(.3,1.5,.5,1),top .22s cubic-bezier(.3,1.5,.5,1);z-index:60;background:var(--night)}
.pump{font-size:clamp(56px,14vmin,110px);filter:drop-shadow(0 0 22px rgba(255,138,61,.6));animation:bob 2.6s ease-in-out infinite}
#stage{position:absolute;inset:0;pointer-events:none}
.ghost{position:absolute;transform:translate(-50%,-50%);width:max(74px,calc(var(--s)*1vmin));pointer-events:auto;cursor:pointer;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.ghost .bob{animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s)}
.body{position:relative}
.body img{display:block;width:100%;height:auto;pointer-events:none}
.body svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform-origin:50% 28%}
.body svg.chg{animation:fp .28s}
@keyframes fp{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.ghost .body{transform:rotate(var(--r,0deg)) scaleX(var(--f,1));filter:drop-shadow(0 0 14px rgba(255,246,223,.45))}
.ghost.hit{animation:hit .45s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes hit{50%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}}
@keyframes bob{50%{transform:translateY(-10px)}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);white-space:nowrap;background:var(--cream);color:#2a1850;
  padding:.3em .8em;border-radius:16px;font-size:clamp(14px,3.8vw,20px);animation:fadein .3s .35s both}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--cream)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
#big .body{width:min(88vw,80vmin);filter:drop-shadow(0 0 40px rgba(255,246,223,.8));animation:rush .35s ease-out both}
#winGhost{animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,246,223,.5))}
@keyframes rush{from{transform:scale(.15)}to{transform:scale(1)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45}
#flash.on{animation:fl .5s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#ask{z-index:30;pointer-events:none}
#ask .card{pointer-events:auto;width:min(88vw,420px);padding:26px 20px 22px;border-radius:28px;background:rgba(21,13,43,.86);border:3px solid var(--moon);
  box-shadow:0 0 40px rgba(255,241,201,.25);display:flex;flex-direction:column;align-items:center;gap:18px;animation:pop2 .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop2{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.q{margin:0;font-size:clamp(26px,7vw,38px);color:var(--moon)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
#hint{margin:0;min-height:1.4em;font-size:clamp(14px,3.8vw,17px);opacity:.85}
#win{z-index:70;background:rgba(21,13,43,.78)}
#win h2{margin:0;font-weight:400;font-size:clamp(36px,10vw,72px);color:var(--pumpkin);text-shadow:0 0 18px rgba(255,138,61,.6)}
#win p{margin:0;font-size:clamp(17px,4.6vw,24px);line-height:1.6}
.conf{position:fixed;top:-8vh;z-index:75;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#mute{position:fixed;z-index:90;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--cream);background:rgba(21,13,43,.7);color:var(--cream);font-size:20px;cursor:pointer}
#mute:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <div class="moon"></div><div class="fog"></div>
  <button id="mute" aria-label="开关声音">🔊</button>

  <section id="start" class="screen">
    <div class="pump">🎃</div>
    <h1>Happy Halloween</h1>
    <p class="sub">今晚的小镇有点不一样……</p>
    <button id="go" class="btn main">推开门看看</button>
  </section>

  <div id="stage"></div>
  <div id="big" hidden></div>
  <div id="flash"></div>

  <section id="ask" class="screen" hidden>
    <div class="card">
      <h2 class="q">吓到你了吗？</h2>
      <div class="row">
        <button id="yes" class="btn main">被吓到了</button>
        <span id="slot"><button id="no" class="btn">才没有</button></span>
      </div>
      <p id="hint">小鬼们都在偷看你的回答</p>
    </div>
  </section>

  <section id="win" class="screen" hidden>
    <div id="winGhost" style="width:min(40vw,190px)"></div>
    <h2>Happy Halloween!</h2>
    <p>嘻嘻，成功啦！<br>愿你今晚收到满满的糖果 🍬</p>
    <button id="again" class="btn main">再被吓一次</button>
  </section>
</div>

/* ---------- sound (all synthesized, no files) ---------- */
let ac,master,muted=false;
function initAudio(){
  if(ac){ac.resume&&ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);drone();}catch(e){ac=null;}
}
function tone(o){
  if(!ac||muted)return;
  const {type='sine',f=440,f2,dur=.3,vol=.2,delay=0,vib=0,rate=6,lp=0}=o;
  const t=ac.currentTime+delay, osc=ac.createOscillator(), g=ac.createGain();
  osc.type=type; osc.frequency.setValueAtTime(f,t);
  if(f2)osc.frequency.exponentialRampToValueAtTime(f2,t+dur);
  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=rate;lg.gain.value=vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.2);}
  const a=Math.min(.06,dur/3);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur+a);
  let n=osc;
  if(lp){const b=ac.createBiquadFilter();b.type='lowpass';b.frequency.value=lp;osc.connect(b);n=b;}
  n.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+a+.05);
}
function noise(dur,vol,lp){
  if(!ac||muted)return;
  const len=ac.sampleRate*dur,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource(),g=ac.createGain(),b=ac.createBiquadFilter();
  s.buffer=buf;g.gain.value=vol;b.type='lowpass';b.frequency.value=lp;
  s.connect(b);b.connect(g);g.connect(master);s.start();
}
function drone(){
  [55,82.4].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.03;
    const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.15+i*.07;lg.gain.value=.015;l.connect(lg);lg.connect(g.gain);l.start();
    o.connect(g);g.connect(master);o.start();});
}
const sfx={
  creak(){tone({type:'sawtooth',f:90,f2:150,dur:.9,vol:.06,vib:14,rate:13,lp:500});tone({type:'sawtooth',f:140,f2:80,dur:.6,vol:.04,delay:.7,vib:10,rate:11,lp:500});},
  boo(p=1){tone({f:380*p,f2:190*p,dur:.8,vol:.22,vib:10,rate:7});tone({type:'triangle',f:190*p,f2:120*p,dur:.8,vol:.12,vib:6,rate:6});},
  pop(){tone({f:300,f2:900,dur:.12,vol:.18});},
  giggle(){for(let i=0;i<4;i++)tone({f:640+(i%2)*160,f2:800+(i%2)*160,dur:.07,vol:.1,delay:i*.09});},
  scare(){noise(.6,.5,1400);tone({type:'sawtooth',f:240,f2:50,dur:.6,vol:.28,lp:900});tone({type:'square',f:700,f2:120,dur:.35,vol:.1,lp:1500});},
  cheer(){[523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>tone({type:'triangle',f,dur:.28,vol:.16,delay:i*.11}));}
};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8;};

const INK='#2a2133',PINK='#ff7a93';
const eye=(x,y,rx=5.5,ry=8.5)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/><circle cx="${x+rx*.35}" cy="${y-ry*.38}" r="${rx*.4}" fill="#fff"/>`;
const st=`fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
const happyEye=(x,y)=>`<path d="M${x-7} ${y+3} Q${x} ${y-8} ${x+7} ${y+3}" ${st}/>`;
const cheeks=`<ellipse cx="73" cy="59" rx="6" ry="3.5" fill="${PINK}" opacity=".45"/><ellipse cx="133" cy="58" rx="6" ry="3.5" fill="${PINK}" opacity=".45"/>`;

  angry:`<path d="M76 39 L94 46 M129 38 L111 45" ${st}/>`+eye(86,52,5,7)+eye(120,51,5,7)+`<path d="M92 68 Q102.5 55 113 68 Q102.5 76 92 68 Z" fill="${INK}"/>`,

  dizzy:`<path d="M79 44 l13 13 M92 44 l-13 13 M114 43 l13 13 M127 43 l-13 13" ${st}/>`+`<path d="M93 65 q3.2 -6 6.4 0 t6.4 0 t6.4 0" ${st}/>`,
  sleepy:`<path d="M79 50 Q86 56 93 50 M114 49 Q121 55 128 49" ${st}/>`+`<ellipse cx="102.5" cy="63" rx="3.5" ry="4" fill="${INK}"/><text x="136" y="40" font-size="14" fill="${INK}" font-family="sans-serif" font-weight="700">z</text>`
};
const FACE_KEYS=Object.keys(FACES);
function setFace(b,n){const s=b.querySelector('svg');s.innerHTML=FACES[n];s.classList.remove('chg');void s.getBoundingClientRect();s.classList.add('chg');b.dataset.face=n;}
function makeBody(face){const b=document.createElement('div');b.className='body';b.innerHTML='<img alt="小鬼"><svg viewBox="0 0 204 204" aria-hidden="true"></svg>';b.querySelector('img').src=GHOST;setFace(b,face);return b;}

/* ---------- ghosts ---------- */
const spots=[
  {x:15,y:68,s:22,say:'Boo!',face:'angry',p:1.1,r:-8},
  {x:84,y:25,s:18,say:'哇呜～',face:'shock',p:1.45,r:8,f:-1},
  {x:80,y:74,s:24,say:'我在你身后哦',face:'wink',p:.9,r:6},
  {x:17,y:24,s:17,say:'嘿嘿，被我发现了',face:'laugh',p:1.5,r:-6},
  {x:50,y:10,s:16,say:'上面也有！',face:'sleepy',p:1.25,r:4}
];
function addGhost(g,i){
  const d=document.createElement('div');d.className='ghost';
  d.style.left=g.x+'%';d.style.top=g.y+'%';d.style.setProperty('--s',g.s);d.style.setProperty('--r',g.r+'deg');
  d.style.setProperty('--f',g.f||1);d.style.setProperty('--d',(i*.4)+'s');
  d.innerHTML='<div class="bob"><div class="bubble"></div></div>';
  const body=makeBody(g.face);d.querySelector('.bob').appendChild(body);d.querySelector('.bubble').textContent=g.say;
  d.addEventListener('pointerdown',()=>{d.classList.remove('hit');void d.offsetWidth;d.classList.add('hit');sfx.giggle();
    setFace(body,'dizzy');body.dataset.hold=1;setTimeout(()=>{delete body.dataset.hold;},1100);});
  stage.appendChild(d);
  setTimeout(function cyc(){
    if(!body.isConnected)return;
    if(!body.dataset.hold){const o=FACE_KEYS.filter(k=>k!==body.dataset.face);setFace(body,o[Math.floor(Math.random()*o.length)]);}
    setTimeout(cyc,1600+Math.random()*1600);
  },1500+Math.random()*1200);sfx.boo(g.p);if(navigator.vibrate)navigator.vibrate(40);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  initAudio();sfx.creak();
  $('#start').hidden=true;
  await wait(1300);
  for(let i=0;i<spots.length;i++){addGhost(spots[i],i);await wait(1250);}
  await wait(700);
  /* big scare */
  const big=$('#big');big.innerHTML='';const bb=makeBody('shock');big.appendChild(bb);big.hidden=false;
  setTimeout(()=>setFace(bb,'angry'),350);setTimeout(()=>setFace(bb,'laugh'),850);
  sfx.scare();if(navigator.vibrate)navigator.vibrate([120,60,160]);
  $('#flash').classList.add('on');app.classList.add('shake');
  await wait(1100);
  big.hidden=true;app.classList.remove('shake');
  $('#ask').hidden=false;sfx.giggle();
}
$('#go').onclick=run;

const no=$('#no'),slot=$('#slot');let moved=false,dodges=0;
const taunts=['再想想～','嘴硬的小朋友会被小鬼盯上哦','我们都看到你抖了一下','点“被吓到了”有惊喜哦','抓不到～抓不到～'];
const labels=['才没有','才没有！','真的没有','不信你抓我','抓不到～'];
function dodge(e){
  if(!moved){const r=no.getBoundingClientRect();slot.style.width=r.width+'px';slot.style.height=r.height+'px';
    no.style.position='fixed';no.style.left=r.left+'px';no.style.top=r.top+'px';moved=true;void no.offsetWidth;no.classList.add('run');}
  dodges++;
  no.textContent=labels[Math.min(dodges,labels.length-1)];
  $('#hint').textContent=taunts[Math.min(dodges-1,taunts.length-1)];
  const w=innerWidth,h=innerHeight,bw=no.offsetWidth,bh=no.offsetHeight,pad=14;
  const px=e&&e.clientX!=null?e.clientX:w/2,py=e&&e.clientY!=null?e.clientY:h/2;
  let x,y,n=0;
  do{x=pad+Math.random()*(w-bw-pad*2);y=pad+Math.random()*(h-bh-pad*2+0.01);n++;}
  while(n<40&&Math.hypot(x+bw/2-px,y+bh/2-py)<170);
  no.style.left=Math.max(pad,x)+'px';no.style.top=Math.max(pad,y)+'px';
  sfx.pop();
}
['pointerenter','pointerdown','focus'].forEach(ev=>no.addEventListener(ev,e=>{if(ev==='pointerdown')e.preventDefault();dodge(e);}));
no.addEventListener('click',e=>{e.preventDefault();dodge(e);});
document.addEventListener('pointermove',e=>{
  if($('#ask').hidden||e.pointerType!=='mouse')return;
  const r=no.getBoundingClientRect();
  const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
  if(Math.hypot(dx,dy)<60)dodge(e);
});

$('#yes').onclick=()=>{
  $('#ask').hidden=true;no.hidden=true;$('#win').hidden=false;sfx.cheer();
  const wg=makeBody('laugh');$('#winGhost').replaceChildren(wg);let wi=0;setInterval(()=>setFace(wg,['wink','laugh','smile'][wi++%3]),1400);
  const em=['🎃','🍬','🦇','👻','🍭','⭐'];
  for(let i=0;i<36;i++){const c=document.createElement('span');c.className='conf';c.textContent=em[i%em.length];
    c.style.left=Math.random()*100+'vw';c.style.fontSize=(18+Math.random()*22)+'px';
    c.style.animationDuration=(3+Math.random()*3)+'s';c.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),7500);}
};
$('#again').onclick=()=>location.reload();
</script>
</body>
